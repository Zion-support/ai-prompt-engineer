<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>AI Prompt Engineer</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🧠 AI Prompt Engineer</h1><p>Score and improve your prompt.</p><textarea id="p" rows="5" placeholder="Paste your prompt..."></textarea><br><button onclick="go()">Score prompt</button><div id="out"></div><script>function go(){const p=document.getElementById('p').value;const w=p.split(/\s+/).length;let s=40,tips=[];if(/you are|act as/i.test(p)){s+=15}else tips.push('Add a role ("You are...")');if(/format|json|table|list/i.test(p)){s+=15}else tips.push('Specify output format');if(/example/i.test(p)){s+=15}else tips.push('Include an example');if(w>15){s+=15}else tips.push('Add more context/detail');document.getElementById('out').textContent=`Score: ${s}/100\n\nImprovements:\n${tips.length?tips.map(t=>'• '+t).join('\n'):'• Excellent prompt!'}\n\nEnterprise prompt optimization & LLM evals: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/ai-prompt-engineer">GitHub</a> · <a href="https://ziontechgroup.com/llm-gateway/">LLM Gateway</a></p></body></html>
